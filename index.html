<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voyage of the Black Pearl</title>
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden}
    #book-canvas{display:block;position:fixed;top:0;left:0;z-index:2}
    body.map-mode #book-canvas{display:none !important}
    #map-canvas{display:none;position:fixed;top:0;left:0;z-index:1}
    body.map-mode #map-canvas{display:block !important}

    #loading{position:fixed;inset:0;z-index:500;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s}
    #loading.out{opacity:0;pointer-events:none}
    #loading h1{font-family:'Pirata One',cursive;color:#fff;font-size:2.4rem;letter-spacing:4px;margin-bottom:8px}
    #loading p{color:#666;font-style:italic;font-family:serif;margin-bottom:28px}
    #bar-bg{width:300px;height:3px;background:#222;border-radius:2px}
    #bar{width:0%;height:100%;background:#fff;border-radius:2px;transition:width 0.3s}
    #pct{color:#444;font-size:0.8rem;margin-top:8px;font-family:monospace}

    #err{display:none;position:fixed;inset:0;z-index:900;background:#000;color:#f55;font-family:monospace;font-size:0.85rem;padding:30px;overflow:auto;white-space:pre-wrap}

    #fade{position:fixed;inset:0;background:#000;z-index:400;opacity:0;pointer-events:none;transition:opacity 0.8s}
    #fade.in{opacity:1}

    #book-hint{position:fixed;bottom:10%;left:50%;transform:translateX(-50%);color:#fff;font-family:'Pirata One',cursive;font-size:1.4rem;letter-spacing:2px;opacity:0;pointer-events:none;animation:fadeUp 2s ease 1s forwards;border-bottom:1px solid rgba(255,255,255,0.25);padding-bottom:3px;z-index:10}
    @keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

    #map-title{position:fixed;top:18px;left:50%;transform:translateX(-50%);font-family:'Pirata One',cursive;color:#fff;font-size:1.9rem;letter-spacing:4px;opacity:0;transition:opacity 0.8s;pointer-events:none;z-index:10;text-shadow:0 2px 12px rgba(0,0,0,0.9)}

    #reset-btn{position:fixed;top:10px;right:10px;padding:5px 10px;background:#333;color:#fff;border:none;cursor:pointer;font-size:12px;z-index:1000;display:none}
    #reset-btn:hover{background:#555}
    
    #map-controls{position:fixed;bottom:30px;right:30px;display:flex;flex-direction:column;gap:10px;z-index:10;opacity:0;pointer-events:none;transition:opacity 0.6s}
    body.map-mode #map-controls{opacity:1;pointer-events:all}
    #map-controls button{padding:8px 16px;background:rgba(10,10,10,0.9);color:#fff;border:1px solid #444;cursor:pointer;font-family:'Pirata One',cursive;font-size:0.9rem;transition:background 0.25s,border-color 0.25s}
    #map-controls button:hover{background:rgba(20,20,20,0.95);border-color:#fff}
    #scale-indicator{position:fixed;bottom:30px;left:30px;color:#fff;font-family:'Pirata One',cursive;font-size:1.2rem;opacity:0;pointer-events:none;transition:opacity 0.6s;z-index:10;text-shadow:0 2px 8px rgba(0,0,0,0.8)}
    body.map-mode #scale-indicator{opacity:1}
    
    #boat-container{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:80px;height:80px;cursor:grab;z-index:20;opacity:0;pointer-events:none;transition:opacity 0.6s}
    body.map-mode #boat-container{opacity:1;pointer-events:all}
    #boat-container:active{cursor:grabbing}
    #boat-icon{font-size:3rem;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5))}
    
    #mini-map{position:fixed;bottom:20px;right:20px;width:60px;height:60px;background:rgba(20,15,10,0.9);border:2px solid #8B4513;border-radius:5px;cursor:pointer;z-index:20;opacity:0;pointer-events:none;transition:opacity 0.6s,transform 0.3s;display:flex;align-items:center;justify-content:center;font-family:'Pirata One',cursive;color:#DAA520;font-size:0.7rem}
    body.map-mode #mini-map{opacity:1;pointer-events:all}
    #mini-map:hover{transform:scale(1.1);border-color:#DAA520}
    
    #waypoint-indicator{position:fixed;top:80px;left:50%;transform:translateX(-50%);color:#DAA520;font-family:'Pirata One',cursive;font-size:1rem;opacity:0;pointer-events:none;transition:opacity 0.6s;z-index:10;text-shadow:0 2px 8px rgba(0,0,0,0.8)}
    body.map-mode #waypoint-indicator{opacity:1}
    
    #toran-popup{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:1000;opacity:0;transition:opacity 0.5s}
    #toran-popup.show{display:flex;opacity:1}
    #toran-content{background:linear-gradient(135deg,#2C1810 0%,#1A0F0A 100%);border:3px solid #8B4513;border-radius:10px;padding:30px;max-width:500px;max-height:80vh;overflow-y:auto;transform:scale(0.5);transition:transform 0.5s cubic-bezier(0.175,0.885,0.32,1.275);box-shadow:0 10px 40px rgba(0,0,0,0.8),inset 0 0 20px rgba(139,69,19,0.3)}
    #toran-popup.show #toran-content{transform:scale(1)}
    #toran-content h2{font-family:'Pirata One',cursive;color:#DAA520;font-size:2rem;margin-bottom:15px;text-align:center;text-shadow:0 2px 4px rgba(0,0,0,0.5)}
    #toran-content p{font-family:'IM Fell English',serif;color:#DEB887;font-size:1.1rem;line-height:1.6;margin-bottom:15px}
    #toran-content .pirate-quote{font-style:italic;color:#CD853F;border-left:3px solid #DAA520;padding-left:15px;margin:20px 0;background:rgba(218,165,32,0.1);padding:15px;border-radius:5px}
    #close-toran{position:absolute;top:15px;right:15px;background:none;border:none;color:#DAA520;font-size:2rem;cursor:pointer;transition:color 0.3s}
    #close-toran:hover{color:#FFD700}
  </style>
</head>
<body>
<div id="loading"><h1>VOYAGE</h1><p>Loading the Black Pearl…</p><div id="bar-bg"><div id="bar"></div></div><div id="pct">0%</div></div>
<div id="err"></div>
<div id="fade"></div>
<div id="book-hint">Click the Book to Begin Your Voyage</div>
<div id="map-title">THE SEVEN SEAS</div>
<div id="map-controls">
  <button id="rotate-left">Rotate Left</button>
  <button id="rotate-right">Rotate Right</button>
  <button id="scale-up">Scale Up</button>
  <button id="scale-down">Scale Down</button>
  <button id="reset-map">Reset Map</button>
</div>
<div id="scale-indicator">1x</div>
<div id="boat-container"><div id="boat-icon">⛵</div></div>
<div id="mini-map">MAP</div>
<div id="waypoint-indicator">Drag the boat to discover hidden treasures!</div>
<button id="reset-btn">Reset to Book</button>

<div id="toran-popup">
  <div id="toran-content">
    <button id="close-toran">&times;</button>
    <h2 id="toran-title">Ancient Secrets</h2>
    <p id="toran-text">Loading ancient pirate wisdom...</p>
    <div id="toran-quote" class="pirate-quote"></div>
  </div>
</div>

<script>
(function(){
'use strict';

function die(msg){var e=document.getElementById('err');e.style.display='block';e.textContent='ERROR:\n\n'+msg;console.error(msg);}
if(typeof THREE==='undefined'){die('THREE not loaded');return;}
if(typeof THREE.GLTFLoader==='undefined'){die('GLTFLoader not loaded');return;}

var W=window.innerWidth, H=window.innerHeight;
var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(W,H);
renderer.domElement.id='book-canvas';
document.body.appendChild(renderer.domElement);

var mapRenderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
mapRenderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
mapRenderer.setSize(W,H);
mapRenderer.domElement.id='map-canvas';
document.body.appendChild(mapRenderer.domElement);

var bookCam=new THREE.PerspectiveCamera(45,W/H,0.01,500);
bookCam.position.set(0,0.8,5.5);
bookCam.lookAt(0,0.3,0);

var clock=new THREE.Clock();
var loader=new THREE.GLTFLoader();
var raycaster=new THREE.Raycaster();
var mouse=new THREE.Vector2();

var bookScene=new THREE.Scene();
bookScene.add(new THREE.AmbientLight(0xffffff,1.0));

var mapScene=new THREE.Scene();
// Natural lighting for original colors
mapScene.add(new THREE.AmbientLight(0xffffff,0.8)); // Reduced ambient light for natural colors
var directionalLight=new THREE.DirectionalLight(0xffffff,0.9);
directionalLight.position.set(5,10,7);
mapScene.add(directionalLight);
var directionalLight2=new THREE.DirectionalLight(0xffffff,0.5);
directionalLight2.position.set(-5,5,-5);
mapScene.add(directionalLight2);

var mapCam=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.01,500);
mapCam.position.set(0,2,6); // Lower and closer to see the vertical map better
mapCam.lookAt(0,0,-2); // Look at the map position

var bookRoot=null;
var mapRoot=null;
var boatRoot=null;
var appState='loading';
var hasSeenBook=false; // Force book to show first for testing
console.log('hasSeenBook:', hasSeenBook);

// Map controls state
var mapRotation=0;
var mapScale=1;
var baseMapScale=1;
var isAutoRotating=false; // No auto-rotation

// Waypoint system
var waypoints=[
  {x:-2,y:0,z:-1,visited:false,title:'Port Royal',text:'The legendary pirate haven where Captain Jack Sparrow first made his name.',quote:'"The code is more what you\'d call guidelines than actual rules."'},
  {x:2,y:0,z:-1,visited:false,title:'Tortuga',text:'A lawless island paradise where pirates gather to drink, gamble, and forget their troubles.',quote:'"You\'re the worst pirate I\'ve ever heard of." "But you have heard of me."'},
  {x:-1.5,y:0,z:1,visited:false,title:'Shipwreck Cove',text:'The hidden meeting place of the Brethren Court, where pirate lords convene.',quote:'"Parley! The pirate code dictates that if one negotiates, parley must be accepted."'},
  {x:1.5,y:0,z:1,visited:false,title:'Isla de Muerta',text:'The cursed island where Cortés\' gold was hidden, dooming all who touched it.',quote:'"Blood must be paid for the gold to be lifted."'},
  {x:0,y:0,z:-2,visited:false,title:'Singapore',text:'The exotic eastern port ruled by the fearsome pirate lord Sao Feng.',quote:'"In a world of deceit, telling the truth is a revolutionary act."'},
  {x:-2,y:0,z:0.5,visited:false,title:'Rum Runner\'s Isle',text:'A desolate island where Jack was marooned with nothing but rum and a pistol.',quote:'"Why is the rum always gone?"'},
  {x:2,y:0,z:0.5,visited:false,title:'The Fountain of Youth',text:'The legendary spring said to restore the youth of those who drink from it.',quote:'"Not all treasure\'s silver and gold, mate."'},
  {x:0,y:0,z:1.5,visited:false,title:'Davy Jones\' Locker',text:'The purgatory where those who seek to cheat death are doomed to serve forever.',quote:'"Life is cruel. Why should the afterlife be any different?"'}
];
var currentWaypointIndex=0;
var boatPosition={x:0,y:0,z:0};

var $loading=document.getElementById('loading');
var $bar=document.getElementById('bar');
var $pct=document.getElementById('pct');
var $fade=document.getElementById('fade');
var $bookHint=document.getElementById('book-hint');
var $mapTitle=document.getElementById('map-title');
var $compass=document.getElementById('compass-btn');

function setProgress(f){var p=Math.round(Math.min(f,1)*100);$bar.style.width=p+'%';$pct.textContent=p+'%';}

function fitTo(obj,targetSize){
  obj.updateWorldMatrix(true,true);
  var box=new THREE.Box3().setFromObject(obj);
  if(box.isEmpty())return;
  var sz=new THREE.Vector3(); box.getSize(sz);
  var ctr=new THREE.Vector3(); box.getCenter(ctr);
  var maxDim=Math.max(sz.x,sz.y,sz.z);
  if(maxDim<=0)return;
  var s=targetSize/maxDim;
  obj.scale.setScalar(s);
  obj.position.set(-ctr.x*s,-ctr.y*s,-ctr.z*s);
}

function goToMap(){
  if(appState!=='book')return;
  console.log('Going to map from book');
  appState='transitioning';
  $bookHint.style.display='none';
  localStorage.setItem('hasSeenBook', 'true'); // Save that user has seen book
  $fade.classList.add('in');
  setTimeout(function(){
    console.log('Switching to map mode');
    document.body.classList.add('map-mode');
    $fade.classList.remove('in');
    setTimeout(function(){
      $mapTitle.style.opacity='1';
      $compass.classList.add('show');
      appState='map';
      console.log('Map state set');
    },700);
  },900);
}

function resetMapView(){
  if(!mapRoot)return;
  mapCam.position.set(0,2,6);
  mapCam.lookAt(0,0,-2);
  mapRotation=0;
  mapScale=2.5; // Reset to 2.5x
  if(mapRoot){
    mapRoot.rotation.y=0;
    mapRoot.rotation.x=-Math.PI/6; // Reset tilt
    mapRoot.scale.setScalar(baseMapScale*mapScale);
  }
  updateScaleIndicator();
}

function rotateMap(direction){
  if(!mapRoot)return;
  isAutoRotating=false;
  mapRotation+=direction*(Math.PI/4); // 45 degrees per click
  mapRoot.rotation.y=mapRotation;
}

function scaleMap(direction){
  if(!mapRoot)return;
  if(direction>0){
    mapScale=Math.min(mapScale+0.5,3); // Max 3x
  }else{
    mapScale=Math.max(mapScale-0.5,0.5); // Min 0.5x
  }
  mapRoot.scale.setScalar(baseMapScale*mapScale);
  updateScaleIndicator();
}

function updateScaleIndicator(){
  var indicator=document.getElementById('scale-indicator');
  if(indicator){
    indicator.textContent=mapScale+'x';
  }
}

function checkWaypointCollision(){
  var threshold=0.8; // Distance threshold for waypoint detection
  for(var i=0;i<waypoints.length;i++){
    var wp=waypoints[i];
    var dx=boatPosition.x-wp.x;
    var dz=boatPosition.z-wp.z;
    var distance=Math.sqrt(dx*dx+dz*dz);
    if(distance<threshold&&!wp.visited){
      wp.visited=true;
      showToranPopup(wp);
      currentWaypointIndex++;
      updateWaypointIndicator();
      return true;
    }
  }
  return false;
}

function showToranPopup(waypoint){
  var popup=document.getElementById('toran-popup');
  var title=document.getElementById('toran-title');
  var text=document.getElementById('toran-text');
  var quote=document.getElementById('toran-quote');
  
  title.textContent=waypoint.title;
  text.textContent=waypoint.text;
  quote.textContent=waypoint.quote;
  
  popup.classList.add('show');
}

function closeToranPopup(){
  document.getElementById('toran-popup').classList.remove('show');
}

function updateWaypointIndicator(){
  var indicator=document.getElementById('waypoint-indicator');
  var visitedCount=waypoints.filter(function(wp){return wp.visited;}).length;
  if(visitedCount>=waypoints.length){
    indicator.textContent='All waypoints discovered! You are a true pirate legend!';
  }else{
    indicator.textContent='Waypoints discovered: '+visitedCount+'/'+waypoints.length;
  }
}

function animate(){
  requestAnimationFrame(animate);
  var t=clock.getElapsedTime();
  if(bookRoot&&appState==='book'){
    bookRoot.rotation.y=Math.sin(t*0.4)*0.35;
    bookRoot.position.y=Math.sin(t*0.7)*0.08;
    renderer.render(bookScene,bookCam);
  }
  if(appState==='map'){
    console.log('Rendering map scene');
    // No auto-rotation for map - stays fixed
    mapRenderer.render(mapScene,mapCam);
  }
}

renderer.domElement.addEventListener('pointerdown',function(e){
  if(appState!=='book'||!bookRoot)return;
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse,bookCam);
  if(raycaster.intersectObject(bookRoot,true).length>0) goToMap();
});

$compass.addEventListener('click', resetMapView);

// Map control buttons
document.getElementById('rotate-left').addEventListener('click',function(){rotateMap(-1);});
document.getElementById('rotate-right').addEventListener('click',function(){rotateMap(1);});
document.getElementById('scale-up').addEventListener('click',function(){scaleMap(1);});
document.getElementById('scale-down').addEventListener('click',function(){scaleMap(-1);});
document.getElementById('reset-map').addEventListener('click',resetMapView);

// Toran popup controls
document.getElementById('close-toran').addEventListener('click',closeToranPopup);

// Mini map click to return to big map
document.getElementById('mini-map').addEventListener('click',function(){
  // This will toggle between mini and big map view
  console.log('Mini map clicked - returning to big map view');
});

// Boat drag functionality
var boatContainer=document.getElementById('boat-container');
var isDragging=false;
var startX,startY;

boatContainer.addEventListener('mousedown',function(e){
  isDragging=true;
  startX=e.clientX;
  startY=e.clientY;
  boatContainer.style.cursor='grabbing';
});

document.addEventListener('mousemove',function(e){
  if(!isDragging||appState!=='map')return;
  
  var deltaX=(e.clientX-startX)*0.01;
  var deltaY=(e.clientY-startY)*0.01;
  
  boatPosition.x+=deltaX;
  boatPosition.z+=deltaY;
  
  // Clamp boat position to reasonable bounds
  boatPosition.x=Math.max(-3,Math.min(3,boatPosition.x));
  boatPosition.z=Math.max(-2,Math.min(2,boatPosition.z));
  
  // Update boat container position on screen
  var screenX=50+(boatPosition.x*15);
  var screenY=80-(boatPosition.z*10);
  boatContainer.style.left=screenX+'%';
  boatContainer.style.bottom=screenY+'%';
  
  startX=e.clientX;
  startY=e.clientY;
  
  // Check for waypoint collision
  checkWaypointCollision();
});

document.addEventListener('mouseup',function(){
  isDragging=false;
  boatContainer.style.cursor='grab';
});

var $resetBtn=document.getElementById('reset-btn');
$resetBtn.style.display='block';
$resetBtn.addEventListener('click',function(){
  localStorage.removeItem('hasSeenBook');
  location.reload();
});

window.addEventListener('resize',function(){
  var w=window.innerWidth,h=window.innerHeight;
  bookCam.aspect=w/h;
  bookCam.updateProjectionMatrix();
  mapCam.aspect=w/h;
  mapCam.updateProjectionMatrix();
  renderer.setSize(w,h);
  mapRenderer.setSize(w,h);
});

setProgress(0.05);

var loadedCount=0;
var totalModels=2; // Book, Map (boat hidden, compass removed)

function checkAllLoaded(){
  loadedCount++;
  var progress=0.05+(loadedCount/totalModels)*0.95;
  setProgress(progress);
  if(loadedCount>=totalModels){
    setTimeout(function(){
      $loading.classList.add('out');
      setTimeout(function(){$loading.style.display='none';},1100);
      
      if(hasSeenBook){
        // Skip book, go directly to map
        appState='map';
        document.body.classList.add('map-mode');
        $mapTitle.style.opacity='1';
        $compass.classList.add('show');
        $bookHint.style.display='none';
        updateScaleIndicator(); // Update scale indicator to show 3x
        updateWaypointIndicator(); // Initialize waypoint indicator
        animate();
      }else{
        // Show book first
        appState='book';
        animate();
      }
    },400);
  }
}

loader.load('book_of_pirate_rules_-_week_5.glb',
  function(g1){
    var inner=g1.scene;
    fitTo(inner,2.5);
    bookRoot=new THREE.Group();
    bookRoot.add(inner);
    bookScene.add(bookRoot);
    console.log('Book loaded with original colors');
    checkAllLoaded();
  },
  function(xhr){
    if(xhr.lengthComputable){
      var percent=(xhr.loaded/xhr.total)*100;
      console.log('Book loading: '+Math.round(percent)+'%');
    }
  },
  function(e){die('Book error: '+e);}
);

loader.load('pirate_map.glb',
  function(g1){
    var inner=g1.scene;
    fitTo(inner,3); // Base size
    baseMapScale=inner.scale.x; // Store base scale
    mapRoot=new THREE.Group();
    mapRoot.add(inner);
    // Position in front, tilted and vertical for better visibility
    mapRoot.position.set(0,1,-2); // Move up slightly
    mapRoot.rotation.x=-Math.PI/8; // Less tilt (22.5 degrees)
    mapRoot.rotation.y=0; // Start with no rotation
    mapScale=2.5; // Start at 2.5x scale
    mapRoot.scale.setScalar(baseMapScale*mapScale);
    mapScene.add(mapRoot);
    console.log('Pirate map loaded with original colors, positioned in front, tilted and vertical');
    checkAllLoaded();
  },
  function(xhr){
    if(xhr.lengthComputable){
      var percent=(xhr.loaded/xhr.total)*100;
      console.log('Map loading: '+Math.round(percent)+'%');
    }
  },
  function(e){die('Map error: '+e);}
);



// Boat hidden for now - using HTML drag instead
/*
loader.load('the_black_pearl.glb',
  function(g1){
    var inner=g1.scene;
    fitTo(inner,1.6); // Double size (0.8 * 2 = 1.6)
    boatRoot=new THREE.Group();
    boatRoot.add(inner);
    boatRoot.position.set(0,0,1);
    boatRoot.rotation.y=Math.PI/4;
    mapScene.add(boatRoot);
    console.log('Boat loaded (double size) and added to scene');
    checkAllLoaded();
  },
  function(xhr){
    if(xhr.lengthComputable){
      var percent=(xhr.loaded/xhr.total)*100;
      console.log('Boat loading: '+Math.round(percent)+'%');
    }
  },
  function(e){
    console.error('Boat loading error:', e);
    // Continue without boat if it fails
    checkAllLoaded();
  }
);
*/

})();
</script>
</body>
</html>
